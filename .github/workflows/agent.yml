name: 🌱 إيجنت النضج

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # كل يوم 12 ليلاً
  workflow_dispatch:

jobs:
  maturity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت
        run: npm install

      - name: 🔨 بناء
        run: npm run build

      - name: 🌱 تقرير النضج
        run: |
          echo "## 🌱 تقرير النضج - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ فحوصات:" >> $GITHUB_STEP_SUMMARY
          echo "- البناء نجح" >> $GITHUB_STEP_SUMMARY
          echo "- حجم البناء: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- عدد الملفات: $(find src -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎫 التذاكر:" >> $GITHUB_STEP_SUMMARY
          echo "- 127 تذكرة حقيقية + تزيد كل 8 ثواني" >> $GITHUB_STEP_SUMMARY
