name: 🌱 إيجنت النضج

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  maturity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 فحص المشروع
        run: |
          echo "## 🌱 تقرير النضج - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 ملفات المشروع:" >> $GITHUB_STEP_SUMMARY
          ls -la >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 package.json:" >> $GITHUB_STEP_SUMMARY
          cat package.json | head -20 >> $GITHUB_STEP_SUMMARY || echo "ما فيه package.json في الجذر" >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت (مع تجاهل الأخطاء)
        continue-on-error: true
        run: npm install

      - name: 🔨 بناء (مع تجاهل الأخطاء)
        continue-on-error: true
        run: npm run build

      - name: 🌱 تقرير نهائي
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ النتيجة:" >> $GITHUB_STEP_SUMMARY
          echo "- المشروع موجود على GitHub" >> $GITHUB_STEP_SUMMARY
          echo "- Actions شغالة" >> $GITHUB_STEP_SUMMARY
          echo "- الإيجنت يفحص كل يوم 12 ليلاً" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo "- ✅ البناء نجح - حجم: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ البناء فشل - يحتاج إصلاح محلي" >> $GITHUB_STEP_SUMMARY
          fi
